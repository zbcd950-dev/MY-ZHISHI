<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的测试网页</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-white/20">
        <h1 class="text-3xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Hello, Flux Drop!</h1>
        <p class="text-gray-300 mb-6">这是一个为您准备的单文件测试网页。您可以将此文件保存为 <code class="bg-black/30 px-2 py-1 rounded text-blue-300">index.html</code>，然后直接拖拽到刚才的网页托管平台中发布！</p>
        <button onclick="alert('恭喜你，JavaScript 交互功能正常！')" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl transition duration-300 shadow-lg shadow-blue-500/30 cursor-pointer">
            点我测试交互
        </button>
    </div>
</body>
</html>
